name: Build Anti-Lag Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Initialize Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/example/antilag
        mkdir -p app/src/main/jniLibs/arm64-v8a

    - name: Create settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AntiLagProject"
        include ':app'
        EOF

    - name: Create Root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'com.android.library' version '8.2.2' apply false
        }
        EOF

    - name: Create App build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.antilag'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.antilag"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.core:core:1.12.0'
        }
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/apk/res/android"
            package="com.example.antilag">

            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

            <application
                android:allowBackup="false"
                android:label="Anti Lag Service">
                
                <activity
                    android:name=".MainActivity"
                    android:theme="@android:style/Theme.NoDisplay"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".AntiLagService"
                    android:foregroundServiceType="specialUse"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

    - name: Create AntiLagService.java
      run: |
        cat << 'EOF' > app/src/main/java/com/example/antilag/AntiLagService.java
        package com.example.antilag;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Intent;
        import android.os.Build;
        import android.os.IBinder;

        public class AntiLagService extends Service {
            
            public native void kichHoatChongLag();

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannel();
                
                Notification.Builder builder;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    builder = new Notification.Builder(this, "AntiLagChannel");
                } else {
                    builder = new Notification.Builder(this);
                }
                
                Notification notification = builder
                        .setContentTitle("Anti-Lag Active")
                        .setContentText("Dịch vụ chống lag đang chạy ngầm...")
                        .setSmallIcon(android.R.drawable.ic_dark_header_fallback)
                        .build();
                
                startForeground(1, notification);

                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        while (true) {
                            try {
                                System.loadLibrary("kk");
                                kichHoatChongLag();
                                Thread.sleep(5000);
                            } catch (Exception e) {
                                e.printStackTrace();
                            }
                        }
                    }
                }).start();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                return START_STICKY;
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }

            private void createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel channel = new NotificationChannel(
                            "AntiLagChannel",
                            "Anti-Lag Service Channel",
                            NotificationManager.IMPORTANCE_LOW
                    );
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(channel);
                    }
                }
            }
        }
        EOF

    - name: Create MainActivity.java
      run: |
        cat << 'EOF' > app/src/main/java/com/example/antilag/MainActivity.java
        package com.example.antilag;

        import android.app.Activity;
        import android.content.Intent;
        import android.os.Build;
        import android.os.Bundle;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                
                Intent serviceIntent = new Intent(this, AntiLagService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(serviceIntent);
                } else {
                    startService(serviceIntent);
                }
                
                finish();
            }
        }
        EOF

    - name: Copy Native Library (libkk.so)
      run: |
        if [ -f "libkk.so" ]; then
          cp libkk.so app/src/main/jniLibs/arm64-v8a/libkk.so
          echo "Sao chép thư viện libkk.so thành công!"
        else
          echo "Lỗi: Không tìm thấy file libkk.so ở thư mục gốc!"
          exit 1
        fi

    - name: Build Android APK
      run: gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntiLag-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
